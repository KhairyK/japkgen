name: JAPK Generator CLI Tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-templates:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        template: [webview, pwa, native, game-java, game-cpp]

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Java 17
      # =========================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # =========================
      # Android SDK
      # =========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK tools
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0"

      # =========================
      # Cache Gradle
      # =========================
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # =========================
      # Make gradlew executable
      # =========================
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # =========================
      # Generate project from japkgen
      # =========================
      - name: Generate project
        run: |
          node cli.js new \
            --name TestApp \
            --package com.test.app \
            --template ${{ matrix.template }} \
            --url https://example.com

      # =========================
      # Build APK (capture logs)
      # =========================
      - name: Build APK (with log capture)
        run: |
          set +e
          cd TestApp
          ./gradlew assembleDebug > build.log 2>&1
          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Build failed for template: ${{ matrix.template }}" >> ../help/error-logs-from-ci.log
            echo "---- LOG START ----" >> ../help/error-logs-from-ci.log
            cat build.log >> ../help/error-logs-from-ci.log
            echo "---- LOG END ----" >> ../help/error-logs-from-ci.log
          fi

          exit $EXIT_CODE

      # =========================
      # Upload APK
      # =========================
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.template }}
          path: TestApp/app/build/outputs/apk/debug/*.apk

      # =========================
      # Upload logs even if failed
      # =========================
      - name: Upload Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs-${{ matrix.template }}
          path: help/error-logs-from-ci.log