name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run japkgen build MyApp
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error output
      render: shell

  - type: input
    id: version
    attributes:
      label: japkgen version

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Linux
        - Windows
        - macOS
        - GitHub Codespaces
        - Other
