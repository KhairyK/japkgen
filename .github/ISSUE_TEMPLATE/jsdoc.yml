name: 🧠 JSDoc Improvement
description: Help improve documentation with JSDoc
title: "[JSDOC] "
labels: ["documentation", "good first issue"]
body:
  - type: textarea
    id: file
    attributes:
      label: File to improve
      placeholder: src/templates/webview.js
    validations:
      required: true

  - type: textarea
    id: missing
    attributes:
      label: What is missing?
      description: Describe what should be documented

  - type: textarea
    id: example
    attributes:
      label: Suggested JSDoc (optional)
      render: javascript

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution type
      options:
        - label: First-time contributor friendly
        - label: Easy JSDoc task
